# Paddock-owned capture configuration (PRD #51 slice 6).
#
# This file is the single definition of WHAT capture records.
#
# ONE READER SINCE S8. It had two: the data repo's capture-leagues.sh built the
# recorder's arguments from it at fire time, and paddock read it for the health
# screen. That agent is unloaded — paddock IS the recorder now, and its
# CaptureSelection reads this file to decide which competitions to scope.
#
# THREE SETTINGS WENT WITH THE AGENT. capture.run-hours, capture.fire-hour-utc
# and capture.ledger-lag-hours described a 12-hour launchd window fired at a
# fixed hour. Nothing fires at any hour now: a fixture enters scope when its
# kickoff comes inside the horizon and leaves when it is over, so there is no
# window to size and no fire to be late for. The lateness verdict they fed moved
# onto scope in S10 -- it asks whether a fixture that was watched produced
# nothing, which is the question those three were a proxy for.
#
# Git is the audit trail: changing the league set is one committed edit here,
# then `bin/deploy-config`, and the ledger records what each night actually
# resolved, so intent and reality can be compared after the fact. The recorder
# reads the DEPLOYED copy (RAPTOR_CONFIG_DIR, #19), not this file, so nothing
# here is live until it is committed and deployed; no restart is needed.
#
# WHAT BOUNDS THIS FILE (#61)
# Capture scope is set by capture's own constraints, never by what the data
# will be used for (CHARTER.md, "What to capture"). Betfair caps a stream
# connection at 200 markets, and the recorder holds ONE connection, trimming
# to the cap by whole events, earliest kickoff first. The cap is per
# connection, not per app key (#56), so one connection is raptor's own choice:
# the key allows several. Widening capacity is a follow-up of #61.

# The leagues to capture, BY NAME, resolved to competition ids at run time.
#
# The top two divisions of England, Germany, Italy and Spain. This set was
# chosen for what the data would be used for, which is not a capture reason
# (#61). What bounds it in capture terms is the one connection's 200 markets
# and the hours the host must stay awake; it is a choice to be revisited as a
# follow-up of #61, not a judgement that other leagues are not worth having.
#
# NAMES, NOT IDS, and deliberately so. The first tiers carry Betfair's old
# small competition ids, but the second tiers do not — Serie B and Segunda sit
# in the same 12.2M block as the per-phase UEFA ids that are known not to be
# stable across seasons. A pinned id list would keep working for the glamour
# divisions and silently stop capturing the second tiers at a season rollover:
# quiet, partial, and invisible until someone counts rows months later.
# Name resolution fails loudly instead, and every night's ledger row records
# the ids it resolved (competitions_resolved) so a rollover is visible.
capture.leagues=English Premier League,English Sky Bet Championship,German Bundesliga,German Bundesliga 2,Italian Serie A,Italian Serie B,Spanish La Liga,Spanish Segunda Division

# MATCH_ODDS plus three O/U lines. Like the leagues, chosen for what the data
# would be used for (#61). In capture terms every type multiplies the markets
# per fixture against the 200-market connection, so this is a capacity choice
# to be revisited as a follow-up of #61.
capture.market-types=MATCH_ODDS,OVER_UNDER_15,OVER_UNDER_25,OVER_UNDER_35

# NO CONTROL SET (#11). capture.control-countries used to name GB, filling
# whatever capacity the leagues left under the subscription cap with markets
# outside them, as a comparison population. Retired because a comparison
# population is an analysis construct, not a capture concern; its selector,
# Betfair's countryCode, is unreliable; and it opened scope hours before the
# leagues' own fixtures on about half of all days, holding the host awake for
# markets outside the configured leagues. Markets it already captured stay in raw as they
# are, flagged `requested = false` on their scope rows.
#
# Absent and empty mean the same thing: no control query is sent, and every
# market in scope is one the leagues above asked for.
