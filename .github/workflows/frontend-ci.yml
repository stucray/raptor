# Frontend build + test gate for the Angular app.
#
# Standalone in-repo workflow — the reusable stucray/workflows
# ci-spring-boot-maven.yml that ci.yml calls is Java-only. Deliberately
# minimal for the walking skeleton (build + vitest); lint/format/report
# gates can grow here as the UI grows.

name: Frontend CI

on:
  # PR-only gate, path-scoped to frontend changes.
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'frontend/raptor-ui/**'
      - '.github/workflows/frontend-ci.yml'
  workflow_dispatch:

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend/raptor-ui

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/raptor-ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test -- --watch=false
