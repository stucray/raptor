server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Backend API + health, reachable via the compose network
    location /api/ {
        proxy_pass http://backend:8080;
    }

    location /actuator/ {
        proxy_pass http://backend:8080;
    }
}
